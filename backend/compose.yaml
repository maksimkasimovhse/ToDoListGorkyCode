services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gorky
      POSTGRES_USER: gorky
      POSTGRES_PASSWORD: gorky
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gorky -d gorky"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
