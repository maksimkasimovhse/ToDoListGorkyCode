<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noti</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body class="is-booting">
  <section class="login" id="login" aria-labelledby="login-title" hidden>
    <div class="login__brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 9.5c1.2 4.2 7.8 4.2 10 0"/><path d="M12 4.5v3"/></svg>
      </span>
      <span class="brand__name">Noti</span>
    </div>

    <form class="login__card" novalidate>
      <h1 class="login__title" id="login-title">Вход</h1>
      <p class="login__note" role="status" hidden></p>

      <label class="field">
        <span class="field__label">Логин</span>
        <input name="login" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64">
      </label>

      <label class="field">
        <span class="field__label">Пароль</span>
        <span class="login__password">
          <input name="password" type="password" autocomplete="current-password" maxlength="1024">
          <button class="login__eye" type="button" aria-label="Показать пароль" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </span>
      </label>

      <p class="login__error" role="alert"></p>
      <button class="btn-primary login__submit" type="submit">Войти</button>
    </form>

    <div class="login__demo">
      <span class="login__demo-label">Тестовые пользователи</span>
      <div class="login__demo-buttons"></div>
    </div>
  </section>

  <header class="topbar">
    <div class="brand">
      <span class="brand__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 9.5c1.2 4.2 7.8 4.2 10 0"/><path d="M12 4.5v3"/></svg>
      </span>
      <span class="brand__name">Noti</span>
    </div>
    <div class="topbar__right">
      <span class="source-badge" id="source-badge" hidden></span>
      <div class="profile-wrap">
        <button class="profile" id="profile-btn" type="button" aria-label="Профиль" aria-haspopup="menu" aria-expanded="false" title="Профиль">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8.5" r="4"/><path d="M4 20.5c0-4.2 3.6-6.5 8-6.5s8 2.3 8 6.5z"/></svg>
        </button>
        <div class="menu" id="profile-menu" role="menu" hidden>
          <div class="menu__name" id="profile-name"></div>
          <button class="menu__item" id="logout-btn" type="button" role="menuitem">Выйти</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel recent" aria-label="Последнее">
      <h2 class="panel__title">Последнее</h2>
      <div class="panel__body">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <input id="recent-search" type="search" placeholder="Поиск" autocomplete="off" aria-label="Поиск по записям">
        </label>
        <div class="filters__label">Выбрать метки:</div>
        <div class="chips" id="recent-filters"></div>
        <h3 class="recent__heading" id="recent-heading">Последние записи</h3>
        <ul class="recent__list" id="recent-list"></ul>
      </div>
    </aside>

    <section class="panel assistant" aria-label="Ассистент">
      <div class="panel__head">
        <h2 class="panel__title" id="assistant-name">Ассистент</h2>
        <div class="assistant__tools">
          <button class="icon-btn" id="settings-btn" type="button" aria-label="Настройки ассистента" title="Имя и голос ассистента">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
          </button>
          <label class="switch">
            <input type="checkbox" id="speak-toggle">
            <span class="switch__track" aria-hidden="true"></span>
            <span>Озвучивать ответы</span>
          </label>
          <button class="btn-ghost" id="new-dialog" type="button">Новый диалог</button>
        </div>
      </div>

      <div class="chat" id="chat">
        <div class="empty" id="chat-empty">
          <button class="mic-hero" id="mic-hero" type="button" aria-label="Начать запись">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="8.5" y="2.5" width="7" height="12" rx="3.5" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3.5"/></svg>
          </button>
          <p class="empty__text">Задайте ассистенту вопрос<br>или создайте задачу или напоминание</p>
          <p class="empty__hint" id="mic-hint"></p>
        </div>
        <div class="messages" id="messages" aria-live="polite"></div>
      </div>

      <div class="composer">
        <div class="selection" id="selection" hidden>
          <span>Про запись:</span>
          <strong id="selection-title"></strong>
          <button type="button" id="selection-clear" aria-label="Снять выбор">×</button>
        </div>
        <form class="composer__form" id="composer">
          <input id="composer-input" type="text" autocomplete="off" placeholder="Напишите сообщение" aria-label="Сообщение ассистенту">
          <button class="icon-btn mic-btn" id="mic-btn" type="button" aria-label="Голосовой ввод">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21"/></svg>
          </button>
          <button class="icon-btn send-btn" id="send-btn" type="submit" aria-label="Отправить">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </form>
      </div>
    </section>

    <aside class="panel planner" id="planner-panel" aria-label="Мои записи">
      <div class="planner__head">
        <h2 class="panel__title">Мои записи</h2>
        <button class="add-btn add-btn--ghost" id="calendar-full" type="button" aria-label="Развернуть календарь на весь экран" title="На весь экран" hidden>
          <svg class="icon-expand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg>
          <svg class="icon-collapse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h-6V4M4 14h6v6M14 10l7-7M10 14l-7 7"/></svg>
        </button>
        <button class="add-btn" id="add-item" type="button" aria-label="Добавить запись" title="Добавить запись">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="views" id="planner-views" role="tablist" aria-label="Вид">
        <button class="views__btn is-active" type="button" role="tab" aria-selected="true" data-view="list">Список</button>
        <button class="views__btn" type="button" role="tab" aria-selected="false" data-view="month">Месяц</button>
        <button class="views__btn" type="button" role="tab" aria-selected="false" data-view="week">Неделя</button>
      </div>
      <div class="planner__list" id="planner-list">
        <div class="tabs" id="planner-tabs" role="tablist">
          <button class="tab is-active" type="button" role="tab" aria-selected="true" data-tab="upcoming">Ближайшие</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-tab="today">Сегодня</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-tab="tomorrow">Завтра</button>
          <button class="tab" type="button" role="tab" aria-selected="false" data-tab="week">Неделя</button>
        </div>
        <div class="planner__body" id="planner-body"></div>
      </div>
      <div class="calendar" id="calendar" hidden></div>
    </aside>
  </main>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <dialog class="dialog" id="settings" aria-labelledby="settings-title">
    <form method="dialog" id="settings-form">
      <h2 class="dialog__title" id="settings-title">Настройки ассистента</h2>

      <label class="field">
        <span class="field__label">Имя</span>
        <input id="settings-name" type="text" maxlength="30" autocomplete="off">
        <span class="field__hint">По имени можно обращаться: «Джарвис, что у меня завтра?»</span>
      </label>

      <div class="field">
        <span class="field__label" id="settings-gender-label">Голос</span>
        <div class="choice" role="radiogroup" aria-label="Голос">
          <label><input type="radio" name="gender" value="female"><span>Женский</span></label>
          <label><input type="radio" name="gender" value="male"><span>Мужской</span></label>
        </div>
      </div>

      <p class="field__hint" id="settings-note"></p>

      <div class="dialog__actions">
        <button class="btn-ghost" type="button" id="settings-preview">Прослушать</button>
        <button class="btn-primary" type="submit">Готово</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog" id="item-dialog" aria-labelledby="item-dialog-title">
    <form class="item-form" novalidate>
      <button class="dialog__close" type="button" data-action="cancel" aria-label="Закрыть" title="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 class="dialog__title" id="item-dialog-title">Новая запись</h2>

      <div class="choice choice--types" role="radiogroup" aria-label="Тип записи">
        <label><input type="radio" name="type" value="task" checked><span><i class="dot dot--task"></i>Задача</span></label>
        <label><input type="radio" name="type" value="reminder"><span><i class="dot dot--reminder"></i>Напоминание</span></label>
        <label><input type="radio" name="type" value="meeting"><span><i class="dot dot--meeting"></i>Встреча</span></label>
      </div>

      <label class="field">
        <span class="field__label">Что нужно сделать</span>
        <input name="title" type="text" maxlength="200" autocomplete="off">
      </label>

      <div class="field-row">
        <label class="field">
          <span class="field__label">Дата</span>
          <input name="date" type="date">
        </label>
        <label class="field">
          <span class="field__label">Время</span>
          <input name="time" type="time">
        </label>
      </div>

      <label class="field" data-for="meeting" hidden>
        <span class="field__label">Длительность</span>
        <select name="duration">
          <option value="30">30 минут</option>
          <option value="60" selected>1 час</option>
          <option value="90">1,5 часа</option>
          <option value="120">2 часа</option>
          <option value="180">3 часа</option>
        </select>
      </label>

      <p class="field__hint item-form__hint"></p>
      <div class="item-form__conflict" role="alert" hidden></div>
      <p class="item-form__error" role="alert"></p>

      <div class="dialog__actions item-form__actions">
        <div class="item-form__extra" hidden>
          <button class="btn-ghost btn-ghost--danger" type="button" data-action="delete">Удалить</button>
          <button class="btn-ghost" type="button" data-action="toggle-done">Выполнено</button>
        </div>
        <button class="btn-primary" type="submit">Добавить</button>
      </div>
    </form>
  </dialog>

  <script>
    // С file:// браузер не загружает ES-модули, и страница выглядит живой, но ничего не делает
    if (location.protocol === 'file:') {
      const note = document.createElement('div');
      note.className = 'file-warning';
      note.textContent = 'Страница открыта как файл, поэтому скрипты и микрофон не работают. Запустите из корня проекта docker compose up -d --build --wait и откройте http://localhost:8080';
      document.body.prepend(note);
    }
  </script>
</body>
</html>
