# Telegram-бот рядом с приложением из корневого compose.yaml. Сначала поднимите его: docker compose up -d --build --wait
services:
  telegram-bot:
    image: node:22-alpine
    restart: unless-stopped
    # Исходники только для чтения: контейнер копирует их к себе и ставит зависимости внутри.
    # Разбор ответов, даты и подписи записей берутся из web/js — те же, что на сайте
    volumes:
      - .:/src/telegram-bot:ro
      - ../web/js:/src/web/js:ro
    command: sh -c "cp -r /src /app && cd /app/telegram-bot && rm -rf node_modules && npm ci --no-audit --no-fund && exec node bot.mjs"
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Задайте TELEGRAM_BOT_TOKEN в telegram-bot/.env}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:-}
      BACKEND_URL: ${BACKEND_URL:-http://backend:8080}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      TIMEZONE: ${TIMEZONE:-Europe/Moscow}
    networks:
      - backend

networks:
  # Сеть, которую создаёт docker compose в корне репозитория (проект backend)
  backend:
    external: true
    name: ${BACKEND_NETWORK:-backend_default}
